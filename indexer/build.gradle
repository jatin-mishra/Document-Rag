plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

ext {
    temporalVersion = '1.38.0'
}

group = 'org.kbase'
version = '0.0.1-SNAPSHOT'
description = 'RagIndexer'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext['elasticsearch-client.version'] = '8.17.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation "io.temporal:temporal-spring-boot-starter:${temporalVersion}"

    implementation "org.apache.httpcomponents.client5:httpclient5"

    implementation 'co.elastic.clients:elasticsearch-java'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation platform('software.amazon.awssdk:bom:2.32.14')
    implementation 'software.amazon.awssdk:s3'

    // PostgreSQL vector store (pgvector) accessed via JDBI SqlObject over a HikariCP pool
    implementation 'org.postgresql:postgresql'
    implementation 'com.zaxxer:HikariCP'
    implementation 'org.jdbi:jdbi3-core:3.49.0'
    implementation 'org.jdbi:jdbi3-sqlobject:3.49.0'
    implementation 'org.jdbi:jdbi3-postgres:3.49.0'
    implementation 'com.pgvector:pgvector:0.1.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "io.temporal:temporal-testing:${temporalVersion}"
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
