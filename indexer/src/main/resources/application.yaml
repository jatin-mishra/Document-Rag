server:
  port: 9265

spring:
  application:
    name: RagIndexer
  temporal:
    connection:
      target: ${TEMPORAL_CONNECTION:127.0.0.1:7233}   # local Temporal dev server (gRPC frontend)
      api-key: ${TEMPORAL_API_KEY:}   # optional; empty for local dev, set to Temporal Cloud API key in prod
      enable-https: ${TEMPORAL_ENABLE_HTTPS:false}   # must be true when api-key is set (Temporal Cloud requires TLS)
    namespace: ${TEMPORAL_NAMESPACE:default}   # default namespace for this app
    workers-auto-discovery:
      packages: org.kbase.ragindexer   # scans for @WorkflowImpl / @ActivityImpl and registers workers


http-service-configurations:
  services:
    default:
      readTimeoutInMillis: 5000
      connectionRequestTimeoutInMillis: 5000
      maxRetries: 3
      retryIntervalInMillis: 1000
      keepAliveInSeconds: 5
      idleConnectionEvictionInSeconds: 60
    dummyServiceConfiguration:
      baseUrl: http://localhost:9090
      readTimeoutInMillis: 5000
      connectionRequestTimeoutInMillis: 5000
  connection:
    maxTotalConnections: 100
    maxConnectionsPerRoute: 20
    connectionTimeoutInMillis: 5000
    socketTimeoutInMillis: 5000
    timeToLiveInMinutes: 30000
    inactivityValidationIntervalInSeconds: 60


s3:
  download:
    in-memory-threshold-bytes: 10485760   # 10 MB; <= in heap (byte[]), > streamed to temp file


awsConfiguration:
  region: "ap-south-1"
  s3:
    download-in-memory-threshold-in-bytes: 10485760

chunkingConfiguration:
  bucket: chunk-store
  path: /chunk-store/

es:
  scheme: http
  host: localhost
  port: 9200
  username:
  password:
  keyword-index: chunk-keyword-store
  connect-timeout-ms: 5000
  socket-timeout-ms: 30000
  max-conn-total: 100
  max-conn-per-route: 50