server:
  port: 9265


spring:
  application:
    name: RagIndexer
  jackson:
    property-naming-strategy: SNAKE_CASE
  temporal:
    connection:
      target: ${TEMPORAL_CONNECTION:127.0.0.1:7233}   # local Temporal dev server (gRPC frontend)
      api-key: ${TEMPORAL_API_KEY:}   # optional; empty for local dev, set to Temporal Cloud API key in prod
      enable-https: ${TEMPORAL_ENABLE_HTTPS:false}   # must be true when api-key is set (Temporal Cloud requires TLS)
    namespace: ${TEMPORAL_NAMESPACE:default}   # default namespace for this app
    workers-auto-discovery:
      packages: org.kbase.ragindexer   # scans for @WorkflowImpl / @ActivityImpl and registers workers


http-service-configurations:
  services:
    default:
      readTimeoutInMillis: 5000
      connectionRequestTimeoutInMillis: 5000
      maxRetries: 3
      retryIntervalInMillis: 1000
      keepAliveInSeconds: 5
      idleConnectionEvictionInSeconds: 60
    document-service:
      baseUrl: http://localhost:8000
      readTimeoutInMillis: 5000
      connectionRequestTimeoutInMillis: 5000
    embedding-service:
      baseUrl: ${OLLAMA_BASE_URL:http://localhost:11434}
      readTimeoutInMillis: 60000            # cold model load into memory + inference
      connectionRequestTimeoutInMillis: 5000
  connection:
    maxTotalConnections: 100
    maxConnectionsPerRoute: 20
    connectionTimeoutInMillis: 5000
    socketTimeoutInMillis: 5000
    timeToLiveInMinutes: 30000
    inactivityValidationIntervalInSeconds: 60


s3:
  download:
    in-memory-threshold-bytes: 10485760   # 10 MB; <= in heap (byte[]), > streamed to temp file


aws-configuration:
  region: "ap-south-1"
  endpoint: "http://localhost:4566"


chunking-configuration:
  bucket: chunk-store
  path: chunk-store

vector-store:
  jdbc-url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/practice}
  username: ${VECTOR_DB_USER:practice}
  password: ${VECTOR_DB_PASSWORD:practice}
  max-pool-size: 10
  connection-timeout-ms: 5000
  embedding-dimension: 1024   # must match the vector(N) column and the embedding model

es:
  scheme: http
  host: localhost
  port: 9200
  username:
  password:
  keyword-index: "chunk_keyword_store"
  connect-timeout-ms: 5000
  socket-timeout-ms: 30000
  max-conn-total: 100
  max-conn-per-route: 50

activity-configuration:
  activities:
    chunking:
      task-queue: "DOCUMENT_CHUNKING"
      startToCloseTimeoutInMinutes: 1
      scheduledToCloseTimeoutInMinutes: 5
      retryConfig:
        initialIntervalInSeconds: 2
        backoffCoefficient: 2.0
        maximumIntervalInSeconds: 60
        maximumAttempts: 5
        doNotRetry:
          - org.kbase.ragindexer.error.AppException
    embedding:
      task-queue: "DOCUMENT_EMBEDDING"
      startToCloseTimeoutInMinutes: 5     # first call after boot pays ollama's model-load cost
      scheduledToCloseTimeoutInMinutes: 30  # must exceed startToClose x attempts + backoff
      retryConfig:
        initialIntervalInSeconds: 5
        backoffCoefficient: 2.0
        maximumIntervalInSeconds: 120
        maximumAttempts: 6