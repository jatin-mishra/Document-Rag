# Success/failure criteria for Step 1: FastAPI boilerplate + dummy health check.
# Reviewed with user before implementation (see tasks/todo.yml for the matching checklist).

step: 1
goal: >
  Stand up a minimal FastAPI service skeleton (retrieval-service) with a working
  health check endpoint, structured so future steps can add RAG strategies
  (indexing, query, storage, loop) without restructuring.

test_cases:
  - id: health_returns_200
    scenario: Client sends GET /health while the app is running with default settings.
    expected: HTTP 200 response.

  - id: health_response_schema
    scenario: Client sends GET /health.
    expected: >
      JSON body exactly {"status": "healthy", "service": <settings.app_name>,
      "version": <settings.app_version>}.

  - id: openapi_docs_reachable
    scenario: Client requests GET /docs and GET /openapi.json.
    expected: Both return HTTP 200 (FastAPI auto-docs wired correctly via create_app()).

  - id: unknown_route_404
    scenario: Client requests a route that doesn't exist, e.g. GET /nope.
    expected: HTTP 404 (default FastAPI behavior, sanity check nothing swallows errors).

  - id: wrong_method_405
    scenario: Client sends POST /health instead of GET.
    expected: HTTP 405 Method Not Allowed.

  - id: pytest_suite_passes
    scenario: Run `uv run pytest -v` from repo root.
    expected: All tests pass, 0 failures, 0 errors.

  - id: ruff_lint_clean
    scenario: Run `uv run ruff check .` from repo root.
    expected: 0 lint errors.

  - id: app_boots_cleanly
    scenario: Run `uv run uvicorn app.main:app --reload` with no .env file present.
    expected: >
      Server starts successfully using default Settings values (no crash,
      no required-env-var errors) since all Settings fields have sane defaults.

  - id: docker_build_succeeds
    scenario: Run `docker build -t retrieval-service .` from repo root.
    expected: Build completes with exit code 0.

  - id: docker_container_health_check
    scenario: >
      Run `docker run -p 8000:8000 retrieval-service`, then curl
      http://localhost:8000/health from the host.
    expected: HTTP 200 with the expected JSON payload, within a few seconds of container start.

  - id: malformed_env_fails_fast
    scenario: Set an env var that maps to a typed Settings field to an invalid value (e.g. PORT=not-a-number).
    expected: >
      App fails to start with a clear pydantic validation error at import/startup time,
      not a silent fallback or a runtime crash mid-request.

failure_conditions:
  - Any test_case above not met.
  - Health check depends on any external service (DB, vector store) — step 1 must stay dependency-free ("dummy").
  - Folder structure requires changes (not just additions) when step 2 introduces RAG strategy modules.
